<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toryne — Bergen Family Interns 2026</title>
    <link rel="icon" href="../assets/logos/bfc-logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Unbounded:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: "#1f9d55",
              coral: "#ff5c3a",
              sky: "#2eb8ff",
              ink: "#102018",
              mist: "#f4fbf7",
              navy: "#0a2540",
            },
            fontFamily: {
              display: ["Unbounded", "sans-serif"],
              sans: ["Sora", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: Sora, sans-serif;
        color: #102018;
        background: #f4fbf7;
      }

      .font-display {
        font-family: Unbounded, sans-serif;
      }

      .profile-shell {
        background:
          radial-gradient(ellipse 70% 50% at 10% 0%, rgba(46, 184, 255, 0.35), transparent 55%),
          radial-gradient(ellipse 60% 45% at 90% 10%, rgba(255, 92, 58, 0.28), transparent 50%),
          radial-gradient(ellipse 55% 40% at 60% 100%, rgba(31, 157, 85, 0.3), transparent 55%),
          linear-gradient(165deg, #e8fff3 0%, #eaf6ff 45%, #fff1eb 100%);
      }

      .avatar {
        background:
          linear-gradient(145deg, #2eb8ff 0%, #0a2540 45%, #ff5c3a 100%);
      }
    </style>
  </head>
  <body class="antialiased">
    <header class="fixed inset-x-0 top-0 z-50">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-4 sm:px-8">
        <a href="../index.html" class="flex items-center gap-3">
          <img
            src="../assets/logos/bfc-logo.png"
            alt="Bergen Family Center"
            class="h-11 w-11 rounded-md sm:h-12 sm:w-12"
            width="48"
            height="48"
          />
          <span class="font-display text-sm font-bold tracking-tight text-ink sm:text-base">
            Bergen Family Center
          </span>
        </a>
        <a
          href="../index.html#interns"
          class="text-sm font-semibold text-navy/70 transition hover:text-navy"
        >
          All interns
        </a>
      </div>
    </header>

    <main class="profile-shell min-h-screen">
      <article class="mx-auto max-w-3xl px-5 pb-20 pt-28 sm:px-8 sm:pt-32">
        <p class="font-display text-sm font-semibold uppercase tracking-[0.2em] text-brand">
          Intern profile · 2026
        </p>

        <div class="mt-8 flex flex-col gap-8 sm:flex-row sm:items-end">
          <img
            src="../assets/logos/bfc-logo.png"
            alt="Bergen Family Center logo"
            class="h-36 w-36 shrink-0 rounded-2xl object-cover sm:h-44 sm:w-44"
            width="176"
            height="176"
          />
          <div>
            <h1 class="font-display text-4xl font-extrabold tracking-tight text-navy sm:text-5xl">
              Toryne
            </h1>
            <p class="mt-2 text-lg text-ink/70">
              Senior · Dwight Morrow High School
            </p>
          </div>
        </div>

        <div class="mt-12 space-y-10">
          <section>
            <h2 class="font-display text-sm font-semibold uppercase tracking-[0.18em] text-coral">
              Career goal
            </h2>
            <p class="mt-3 text-2xl font-semibold tracking-tight text-navy sm:text-3xl">
              Electrician
            </p>
          </section>

          <section>
            <h2 class="font-display text-sm font-semibold uppercase tracking-[0.18em] text-sky">
              Placement
            </h2>
            <p class="mt-3 text-2xl font-semibold tracking-tight text-navy sm:text-3xl">
              Summer Camp
            </p>
            <p class="mt-2 text-lg text-ink/65">
              Loved working with the kids.
            </p>
          </section>

          <section>
            <h2 class="font-display text-sm font-semibold uppercase tracking-[0.18em] text-brand">
              Why BFC
            </h2>
            <blockquote class="mt-4 max-w-2xl text-2xl font-medium leading-snug tracking-tight text-navy sm:text-3xl">
              “BFC provided opportunity — and I loved working with the kids in summer camp.”
            </blockquote>
          </section>
        </div>
      </article>
    </main>

    <footer class="border-t border-ink/10 bg-mist">
      <div class="mx-auto flex max-w-6xl items-center gap-3 px-5 py-8 sm:px-8">
        <img
          src="../assets/logos/bfc-logo.png"
          alt=""
          class="h-9 w-9 rounded-md"
          width="36"
          height="36"
          aria-hidden="true"
        />
        <p class="text-sm text-ink/60">Bergen Family Interns 2026</p>
      </div>
    </footer>
  </body>
</html>
